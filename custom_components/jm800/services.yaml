ptz:
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    direction:
      required: true
      selector:
        select:
          options: [up, down, left, right, left_up, right_up, left_down, right_down, ZoomTele, ZoomWide, FocusNear, FocusFar, IrisLarge, IrisSmall, stop]
    speed:
      default: 5
      selector:
        number: {min: 1, max: 10}
    duration:
      default: 0.5
      selector:
        number: {min: 0, max: 30, step: 0.1, unit_of_measurement: s}
goto_preset: &preset
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    preset:
      required: true
      selector:
        number: {min: 1, max: 255, mode: box}
save_preset: *preset
delete_preset: *preset
play_sound:
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    file:
      default: /opt/ch/alarm/Warning.mp3
      selector:
        select:
          custom_value: true
          options:
            - /opt/ch/alarm/Warning.mp3
            - /opt/ch/alarm/Dog_bark.mp3
            - /opt/ch/alarm/alarm-plc.mp3
            - /opt/ch/alarm/attention_en.mp3
            - /opt/ch/alarm/Welcome.mp3
            - /opt/ch/alarm/Audio.mp3
stop_sound:
  target:
    entity:
      integration: jm800
      domain: camera
set_day_night:
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    mode:
      required: true
      selector:
        select:
          options: [day, night]
set_light:
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    "on":
      required: true
      selector:
        boolean:
raw_command:
  target:
    entity:
      integration: jm800
      domain: camera
  fields:
    endpoint:
      required: true
      example: getPtzConfig
      selector:
        text:
    body:
      example: "<xml><cmd>stop</cmd></xml>"
      selector:
        text:
          multiline: true
